<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>SkanDoku</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      padding-right: 64px;
    }

    /* Strefa scrollowania palcem po prawej */
    #scrollbar {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: 38px;
      z-index: 100;
    }
    h1 { font-size: 1.5rem; color: #1a1a2e; margin-bottom: 2px; }
    .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 24px; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      margin-bottom: 14px;
    }
    .step-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #4361ee;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-bottom: 10px;
    }
    .btn:last-child { margin-bottom: 0; }
    .btn:active { opacity: 0.75; }
    .btn-primary  { background: #4361ee; color: white; }
    .btn-outline  { background: white; color: #4361ee; border: 2px solid #4361ee; }
    .btn-success  { background: #25D366; color: white; }
    .btn-email    { background: #ea4335; color: white; }
    .btn-gray     { background: #f0f2f5; color: #444; }

    /* Podgląd z nakładką rogów */
    .preview-wrap {
      position: relative;
      width: 100%;
      margin: 12px 0;
      border-radius: 10px;
      overflow: hidden;
      background: #222;
      display: none;
    }
    .preview-wrap img { width: 100%; display: block; }
    #cornerCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      touch-action: none;
      cursor: crosshair;
    }
    .badge {
      position: absolute;
      top: 8px; right: 8px;
      background: #4361ee;
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
    }

    /* Wynik skanu */
    .scan-wrap {
      position: relative;
      width: 100%;
      margin: 12px 0;
      border-radius: 10px;
      overflow: hidden;
      background: #222;
      display: none;
    }
    #scanCanvas { width: 100%; display: block; }

    .quality-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .q-btn {
      flex: 1;
      padding: 9px 4px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: white;
      font-size: 0.78rem;
      font-weight: 600;
      color: #666;
      cursor: pointer;
    }
    .q-btn.active { border-color: #4361ee; color: #4361ee; background: #eef0fd; }

    .hint { font-size: 0.78rem; color: #999; text-align: center; margin-top: 6px; }
    #fileInput { display: none; }
    .spinner { text-align: center; padding: 10px; color: #888; font-size: 0.85rem; display: none; }
  </style>
</head>
<body>
<div id="scrollbar"></div>

<h1>📄 SkanDoku</h1>
<p class="subtitle">Zdjęcie dokumentu → gotowy skan</p>

<!-- KROK 1 -->
<div class="card" id="step1">
  <div class="step-label">Krok 1 — Zrób zdjęcie</div>
  <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">📷 Zrób zdjęcie / wybierz plik</button>
  <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="onFileLoad(event)" />
</div>

<!-- KROK 2 — Przytnij -->
<div class="card" id="step2" style="display:none">
  <div class="step-label">Krok 2 — Przytnij dokument</div>
  <div class="preview-wrap" id="prevWrap">
    <img id="origImg" alt="" />
    <canvas id="cornerCanvas"></canvas>
    <span class="badge" style="right:auto;left:50%;transform:translateX(-50%)">↖ przeciągnij rogi ↗</span>
  </div>
  <p class="hint">Przeciągnij niebieskie kółka na rogi dokumentu</p>
  <div class="spinner" id="spin1">⏳ Wykrywam obrys...</div>
  <button class="btn btn-primary" style="margin-top:10px" onclick="processAndScan()">✂️ Przytnij i skanuj</button>
  <button class="btn btn-gray" onclick="resetCorners()">🔄 Resetuj rogi</button>
</div>

<!-- KROK 3 — Skan -->
<div class="card" id="step3" style="display:none">
  <div class="step-label">Krok 3 — Jakość skanu</div>
  <div class="quality-row">
    <button class="q-btn active" id="q-bw"    onclick="setMode('bw')">⬛ Czarno-białe</button>
    <button class="q-btn"       id="q-gray"  onclick="setMode('gray')">🔲 Szarości</button>
    <button class="q-btn"       id="q-color" onclick="setMode('color')">🌈 Kolor</button>
  </div>
  <div class="scan-wrap" id="scanWrap">
    <canvas id="scanCanvas"></canvas>
    <span class="badge">SKAN</span>
  </div>
  <div class="spinner" id="spin2">⏳ Przetwarzam...</div>
  <button class="btn btn-outline" onclick="downloadScan()">💾 Pobierz skan</button>
</div>

<!-- KROK 4 — Wyślij -->
<div class="card" id="step4" style="display:none">
  <div class="step-label">Krok 4 — Wyślij do biura</div>
  <button class="btn btn-success" onclick="sendWhatsApp()">💬 Wyślij przez WhatsApp</button>
  <button class="btn btn-email"   onclick="sendEmail()">✉️ Wyślij emailem</button>
</div>

<script>
// ─── Scrollbar ───────────────────────────────────────────
const bar   = document.getElementById('scrollbar');
const thumb = document.getElementById('scrollthumb');
let draggingBar = false, dragStartY = 0, dragStartScroll = 0;

function updateThumb() {
  const barH    = bar.clientHeight;
  const docH    = document.documentElement.scrollHeight;
  const scrollY = window.scrollY;
  const ratio   = docH > barH ? barH / docH : 1;
  const thumbH  = Math.max(40, barH * ratio);
  const thumbTop = (scrollY / (docH - barH)) * (barH - thumbH);
  thumb.style.height = thumbH + 'px';
  thumb.style.top    = (isNaN(thumbTop) ? 0 : thumbTop) + 'px';
}

window.addEventListener('scroll', updateThumb, {passive: true});
window.addEventListener('resize', updateThumb);
updateThumb();

// Kliknięcie na pasek — skocz do pozycji
bar.addEventListener('click', e => {
  if (e.target === thumb) return;
  const rect    = bar.getBoundingClientRect();
  const clickY  = e.clientY - rect.top;
  const barH    = bar.clientHeight;
  const docH    = document.documentElement.scrollHeight;
  window.scrollTo({ top: (clickY / barH) * docH, behavior: 'smooth' });
});

// Przeciąganie kciuka
thumb.addEventListener('mousedown',  e => { draggingBar = true; dragStartY = e.clientY; dragStartScroll = window.scrollY; e.preventDefault(); });
thumb.addEventListener('touchstart', e => { draggingBar = true; dragStartY = e.touches[0].clientY; dragStartScroll = window.scrollY; }, {passive:true});

window.addEventListener('mousemove', e => {
  if (!draggingBar) return;
  const dy   = e.clientY - dragStartY;
  const docH = document.documentElement.scrollHeight;
  const barH = bar.clientHeight;
  window.scrollTo(0, dragStartScroll + (dy / barH) * docH);
});
window.addEventListener('touchmove', e => {
  if (!draggingBar) return;
  const dy   = e.touches[0].clientY - dragStartY;
  const docH = document.documentElement.scrollHeight;
  const barH = bar.clientHeight;
  window.scrollTo(0, dragStartScroll + (dy / barH) * docH);
}, {passive:true});
window.addEventListener('mouseup',  () => { draggingBar = false; });
window.addEventListener('touchend', () => { draggingBar = false; });

function updateStepbar() {} // zachowane dla kompatybilności

// ─── Stan ───────────────────────────────────────────────
let origImg = null;       // HTMLImageElement
let warpedCanvas = null;  // canvas po perspective warp
let corners = [];         // [{x,y}] w pikselach obrazu (nie CSS)
let mode = 'bw';
const CORNER_R = 18;      // promień kółka dotyku (px CSS)

// ─── Wczytanie pliku ────────────────────────────────────
function onFileLoad(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById('origImg');
    img.onload = () => {
      origImg = img;
      document.getElementById('prevWrap').style.display = 'block';
      document.getElementById('step2').style.display = 'block';
      document.getElementById('step3').style.display = 'none';
      document.getElementById('step4').style.display = 'none';
      document.getElementById('scanWrap').style.display = 'none';
      updateStepbar(2);
      resizeCornerCanvas();
      document.getElementById('spin1').style.display = 'block';
      setTimeout(() => {
        corners = detectCorners(img);
        document.getElementById('spin1').style.display = 'none';
        drawOverlay();
      }, 80);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ─── Rozmiar canvas nakładki ─────────────────────────────
function resizeCornerCanvas() {
  const img = document.getElementById('origImg');
  const cc  = document.getElementById('cornerCanvas');
  cc.width  = img.clientWidth;
  cc.height = img.clientHeight;
}

function imgToCSS(pt) {
  const img = document.getElementById('origImg');
  return {
    x: pt.x / img.naturalWidth  * img.clientWidth,
    y: pt.y / img.naturalHeight * img.clientHeight
  };
}
function cssToImg(pt) {
  const img = document.getElementById('origImg');
  return {
    x: pt.x / img.clientWidth  * img.naturalWidth,
    y: pt.y / img.clientHeight * img.naturalHeight
  };
}

// ─── Rysowanie nakładki ──────────────────────────────────
function drawOverlay() {
  const cc  = document.getElementById('cornerCanvas');
  const ctx = cc.getContext('2d');
  ctx.clearRect(0, 0, cc.width, cc.height);
  if (corners.length !== 4) return;

  const pts = corners.map(imgToCSS);

  // Obszar
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fillStyle   = 'rgba(67,97,238,0.12)';
  ctx.strokeStyle = '#4361ee';
  ctx.lineWidth   = 2.5;
  ctx.fill();
  ctx.stroke();

  // Kółka
  pts.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, CORNER_R * 0.7, 0, Math.PI * 2);
    ctx.fillStyle   = '#4361ee';
    ctx.strokeStyle = 'white';
    ctx.lineWidth   = 3;
    ctx.fill();
    ctx.stroke();
  });
}

function resetCorners() {
  if (!origImg) return;
  const W = origImg.naturalWidth, H = origImg.naturalHeight;
  const m = Math.min(W, H) * 0.05;
  corners = [{x:m,y:m},{x:W-m,y:m},{x:W-m,y:H-m},{x:m,y:H-m}];
  drawOverlay();
}

// ─── Drag rogów ─────────────────────────────────────────
let dragging = -1;
const cc = document.getElementById('cornerCanvas');

function getPos(e) {
  const rect = cc.getBoundingClientRect();
  const src  = e.touches ? e.touches[0] : e;
  return { x: src.clientX - rect.left, y: src.clientY - rect.top };
}

function startDrag(e) {
  if (corners.length !== 4) return;
  e.preventDefault();
  const pos = getPos(e);
  dragging = corners.map(imgToCSS).findIndex(p =>
    Math.hypot(p.x - pos.x, p.y - pos.y) < CORNER_R * 1.5
  );
}
function moveDrag(e) {
  if (dragging < 0) return;
  e.preventDefault();
  const pos = getPos(e);
  corners[dragging] = cssToImg(pos);
  drawOverlay();
}
function endDrag() { dragging = -1; }

cc.addEventListener('mousedown',  startDrag);
cc.addEventListener('mousemove',  moveDrag);
cc.addEventListener('mouseup',    endDrag);
cc.addEventListener('touchstart', startDrag, {passive:false});
cc.addEventListener('touchmove',  moveDrag,  {passive:false});
cc.addEventListener('touchend',   endDrag);
window.addEventListener('resize', () => { resizeCornerCanvas(); drawOverlay(); });

// ─── Wykrywanie rogów ────────────────────────────────────
function detectCorners(img) {
  const SCALE = 400 / Math.max(img.naturalWidth, img.naturalHeight);
  const sw = Math.round(img.naturalWidth  * SCALE);
  const sh = Math.round(img.naturalHeight * SCALE);

  const tmp = document.createElement('canvas');
  tmp.width = sw; tmp.height = sh;
  const ctx = tmp.getContext('2d');
  ctx.drawImage(img, 0, 0, sw, sh);

  const imgd = ctx.getImageData(0, 0, sw, sh).data;
  const gray = new Float32Array(sw * sh);
  for (let i = 0; i < sw * sh; i++) {
    gray[i] = 0.299*imgd[i*4] + 0.587*imgd[i*4+1] + 0.114*imgd[i*4+2];
  }

  // Gaussian blur 5x5
  const K = [1,4,6,4,1, 4,16,24,16,4, 6,24,36,24,6, 4,16,24,16,4, 1,4,6,4,1];
  const blur = new Float32Array(sw * sh);
  for (let y = 2; y < sh-2; y++) for (let x = 2; x < sw-2; x++) {
    let s = 0;
    for (let ky = -2; ky <= 2; ky++)
      for (let kx = -2; kx <= 2; kx++)
        s += gray[(y+ky)*sw+(x+kx)] * K[(ky+2)*5+(kx+2)];
    blur[y*sw+x] = s / 256;
  }

  // Sobel
  const edge = new Float32Array(sw * sh);
  let maxE = 0;
  for (let y = 1; y < sh-1; y++) for (let x = 1; x < sw-1; x++) {
    const gx = -blur[(y-1)*sw+(x-1)] + blur[(y-1)*sw+(x+1)]
               -2*blur[y*sw+(x-1)]   + 2*blur[y*sw+(x+1)]
               -blur[(y+1)*sw+(x-1)] + blur[(y+1)*sw+(x+1)];
    const gy = -blur[(y-1)*sw+(x-1)] - 2*blur[(y-1)*sw+x] - blur[(y-1)*sw+(x+1)]
               +blur[(y+1)*sw+(x-1)] + 2*blur[(y+1)*sw+x] + blur[(y+1)*sw+(x+1)];
    edge[y*sw+x] = Math.sqrt(gx*gx + gy*gy);
    if (edge[y*sw+x] > maxE) maxE = edge[y*sw+x];
  }

  const thresh = maxE * 0.15;
  let tl={x:sw,y:sh}, tr={x:0,y:sh}, br={x:0,y:0}, bl={x:sw,y:0};
  let tlS=Infinity, trS=-Infinity, brS=-Infinity, blS=Infinity;

  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    if (edge[y*sw+x] < thresh) continue;
    const s = x + y, d = x - y;
    if (s < tlS) { tlS = s; tl = {x,y}; }
    if (d > trS) { trS = d; tr = {x,y}; }
    if (s > brS) { brS = s; br = {x,y}; }
    if (d < blS) { blS = d; bl = {x,y}; }
  }

  // Sprawdź czy wykrycie ma sens (czy nie jest zdegenerowane)
  const area = quadArea(tl, tr, br, bl);
  const imgArea = sw * sh;
  if (area < imgArea * 0.05) return fallbackCorners(img);

  const inv = 1 / SCALE;
  return [tl, tr, br, bl].map(p => ({x: p.x*inv, y: p.y*inv}));
}

function quadArea(a, b, c, d) {
  // Shoelace
  const pts = [a,b,c,d];
  let area = 0;
  for (let i = 0; i < 4; i++) {
    const j = (i+1) % 4;
    area += pts[i].x * pts[j].y;
    area -= pts[j].x * pts[i].y;
  }
  return Math.abs(area) / 2;
}

function fallbackCorners(img) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const m = Math.min(W, H) * 0.05;
  return [{x:m,y:m},{x:W-m,y:m},{x:W-m,y:H-m},{x:m,y:H-m}];
}

// ─── Perspektywa + skan ──────────────────────────────────
function processAndScan() {
  if (corners.length !== 4) return;
  document.getElementById('spin2').style.display = 'block';
  document.getElementById('scanWrap').style.display = 'none';

  setTimeout(() => {
    warpedCanvas = perspectiveWarp(origImg, corners);
    applyMode();
    document.getElementById('step3').style.display = 'block';
    document.getElementById('step4').style.display = 'block';
    document.getElementById('spin2').style.display = 'none';
    document.getElementById('scanWrap').style.display = 'block';
    document.getElementById('step3').scrollIntoView({behavior:'smooth'});
    updateStepbar(3);
  }, 60);
}

function setMode(m) {
  mode = m;
  ['bw','gray','color'].forEach(k => document.getElementById('q-'+k).classList.remove('active'));
  document.getElementById('q-'+m).classList.add('active');
  if (warpedCanvas) {
    document.getElementById('spin2').style.display = 'block';
    document.getElementById('scanWrap').style.display = 'none';
    setTimeout(() => {
      applyMode();
      document.getElementById('spin2').style.display = 'none';
      document.getElementById('scanWrap').style.display = 'block';
    }, 40);
  }
}

function applyMode() {
  const src = warpedCanvas;
  const ctx2 = src.getContext('2d');
  const id   = ctx2.getImageData(0, 0, src.width, src.height);

  const out = document.getElementById('scanCanvas');
  out.width  = src.width;
  out.height = src.height;
  const outCtx = out.getContext('2d');
  const od = outCtx.createImageData(src.width, src.height);

  if (mode === 'bw') {
    adaptiveThreshold(id.data, od.data, src.width, src.height);
  } else if (mode === 'gray') {
    grayscaleEnhance(id.data, od.data, src.width, src.height);
  } else {
    colorEnhance(id.data, od.data, src.width, src.height);
  }
  outCtx.putImageData(od, 0, 0);
}

function adaptiveThreshold(src, dst, w, h) {
  for (let i = 0; i < w * h; i++) {
    const r = src[i*4], g = src[i*4+1], b = src[i*4+2];
    let lum = 0.299*r + 0.587*g + 0.114*b;
    lum = Math.min(255, Math.max(0, (lum - 128) * 1.8 + 160));
    const val = lum > 175 ? 255 : lum > 100 ? lum : 0;
    dst[i*4] = dst[i*4+1] = dst[i*4+2] = val;
    dst[i*4+3] = 255;
  }
}

function grayscaleEnhance(src, dst, w, h) {
  for (let i = 0; i < w * h; i++) {
    let g = 0.299*src[i*4] + 0.587*src[i*4+1] + 0.114*src[i*4+2];
    g = Math.min(255, Math.max(0, (g - 128) * 1.5 + 155));
    dst[i*4] = dst[i*4+1] = dst[i*4+2] = g;
    dst[i*4+3] = 255;
  }
}

function colorEnhance(src, dst, w, h) {
  for (let i = 0; i < w * h; i++) {
    for (let c = 0; c < 3; c++) {
      dst[i*4+c] = Math.min(255, Math.max(0, (src[i*4+c] - 128) * 1.35 + 148));
    }
    dst[i*4+3] = 255;
  }
}

// ─── Perspektywiczne prostowanie ─────────────────────────
function perspectiveWarp(img, pts) {
  // pts: [TL, TR, BR, BL] w pikselach oryginału
  const [tl, tr, br, bl] = pts;

  // Docelowe wymiary: szerokość = max(|TR-TL|, |BR-BL|), wysokość analogicznie
  const dw = Math.round(Math.max(dist(tl,tr), dist(bl,br)));
  const dh = Math.round(Math.max(dist(tl,bl), dist(tr,br)));

  // Narysuj oryginał na canvasie
  const srcC = document.createElement('canvas');
  srcC.width = img.naturalWidth; srcC.height = img.naturalHeight;
  srcC.getContext('2d').drawImage(img, 0, 0);

  const dstC = document.createElement('canvas');
  dstC.width = dw; dstC.height = dh;
  const dstCtx = dstC.getContext('2d');

  const srcData = srcC.getContext('2d').getImageData(0, 0, srcC.width, srcC.height).data;
  const dstData = dstCtx.createImageData(dw, dh);

  // Homografia: dst -> src (odwrotne mapowanie)
  const dstPts = [{x:0,y:0},{x:dw,y:0},{x:dw,y:dh},{x:0,y:dh}];
  const H = computeHomography(dstPts, [tl, tr, br, bl]);

  for (let dy = 0; dy < dh; dy++) {
    for (let dx = 0; dx < dw; dx++) {
      const {x: sx, y: sy} = applyH(H, dx, dy);
      const si = (Math.round(sy) * srcC.width + Math.round(sx)) * 4;
      const di = (dy * dw + dx) * 4;
      if (sx >= 0 && sx < srcC.width && sy >= 0 && sy < srcC.height) {
        dstData.data[di]   = srcData[si];
        dstData.data[di+1] = srcData[si+1];
        dstData.data[di+2] = srcData[si+2];
        dstData.data[di+3] = 255;
      }
    }
  }
  dstCtx.putImageData(dstData, 0, 0);
  return dstC;
}

function dist(a, b) { return Math.hypot(a.x-b.x, a.y-b.y); }

function computeHomography(src, dst) {
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const {x:sx,y:sy} = src[i], {x:dx,y:dy} = dst[i];
    A.push([sx,sy,1,0,0,0,-dx*sx,-dx*sy]); b.push(dx);
    A.push([0,0,0,sx,sy,1,-dy*sx,-dy*sy]); b.push(dy);
  }
  return [...gaussSolve(A, b), 1];
}

function applyH(H, x, y) {
  const w = H[6]*x + H[7]*y + H[8];
  return { x: (H[0]*x + H[1]*y + H[2]) / w, y: (H[3]*x + H[4]*y + H[5]) / w };
}

function gaussSolve(A, b) {
  const n = 8;
  const M = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < n; c++) {
    let max = c;
    for (let r = c+1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[max][c])) max = r;
    [M[c], M[max]] = [M[max], M[c]];
    for (let r = c+1; r < n; r++) {
      const f = M[r][c] / M[c][c];
      for (let j = c; j <= n; j++) M[r][j] -= f * M[c][j];
    }
  }
  const x = new Array(n);
  for (let i = n-1; i >= 0; i--) {
    x[i] = M[i][n] / M[i][i];
    for (let j = i-1; j >= 0; j--) M[j][n] -= M[j][i] * x[i];
  }
  return x;
}

// ─── Pobieranie i wysyłanie ──────────────────────────────
function downloadScan() {
  const canvas = document.getElementById('scanCanvas');
  const link = document.createElement('a');
  link.download = 'skan_' + new Date().toISOString().slice(0,10) + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function sendWhatsApp() {
  updateStepbar(4);
  const canvas = document.getElementById('scanCanvas');
  const date = new Date().toLocaleDateString('pl');

  // Web Share API — otwiera natywne menu telefonu (WhatsApp, email, itp.)
  if (navigator.canShare) {
    canvas.toBlob(async blob => {
      const file = new File([blob], 'skan_' + date.replace(/\./g,'-') + '.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Skan dokumentu',
            text: 'Skan dokumentu ' + date
          });
          return;
        } catch (e) {
          if (e.name === 'AbortError') return; // użytkownik anulował
        }
      }
      fallbackWhatsApp();
    }, 'image/png');
  } else {
    fallbackWhatsApp();
  }
}

function fallbackWhatsApp() {
  downloadScan();
  setTimeout(() => {
    window.open('https://wa.me/?text=' + encodeURIComponent('Przesyłam skan dokumentu ' + new Date().toLocaleDateString('pl')));
  }, 600);
}

function sendEmail() {
  downloadScan();
  setTimeout(() => {
    const email = prompt("Adres email biura:");
    if (email) {
      const subj = encodeURIComponent('Skan dokumentu ' + new Date().toLocaleDateString('pl'));
      window.location.href = 'mailto:' + email + '?subject=' + subj + '&body=W%20za%C5%82%C4%85czniku%20przesy%C5%82am%20skan%20dokumentu.';
    }
  }, 600);
}
